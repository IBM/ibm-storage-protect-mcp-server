# commands.ini
# Command file for use with IBM Spectrum Protect server servermon component
# Version 8.1.14
# 2022-01-11

#**************************************************************************
# Spectrum Protect Administrative Command Line Commands
#
# The following stanzas determine Spectrum Protect server-side commands
# which are run from a dedicated set of collection threads on the Spectrum
# Protect server for each of the following frequency intervals:
#     [srv_10min]    -  Every 10 minutes
#     [srv_20min]    -  Every 20 minutes
#     [srv_60min]    -  Every 60 minutes
#     [srv_daily]    -  At the start of 24 hours
#     [srv_summary]  -  At the end of 24 hours
# All commands are run from within a Spectrum Protect command-line
# interface administrative shell, similar to DSMADMC or the Operations
# Center Command Builder. The stanza selected will determine which output
# file the command output is included within.
#
# DO NOT modify this file as this file will be automatically updated
# when newer versions are available. If you desire to run commands
# specific to your environment, create a commandscustom.ini file, add
# stanzas and commands like they are found in this file.
#**************************************************************************

[srv_10min]
###########################################################################
# Commands run approximately every 10 minutes.
# Output file:   *-10min-show.xml
###########################################################################
# Fetch information about server sessions, transactions, locks, database
# and log status, dedupthreads, sessions, etc.
QUERY PROCESS
SHOW LOCKS ONLYWAITERS=YES
QUERY DB FORMAT=DETAILED
QUERY DBSPACE FORMAT=DETAILED
QUERY LOG FORMAT=DETAILED
QUERY DEVCLASS FORMAT=DETAILED
QUERY STGPOOL FORMAT=DETAILED
QUERY STGPOOLDIRECTORY FORMAT=DETAILED
QUERY REPLICATION * STATUS=RUNNING FORMAT=DETAILED
SHOW DEDUPTHREAD
SHOW BANNER
SHOW RESQUEUE
SHOW TXNTABLE LOCKDETAIL=NO
QUERY MOUNT
QUERY SESSION FORMAT=DETAILED
SHOW SESSION FORMAT=DETAILED
SHOW THREADS
SHOW JVM
SHOW PRODCONS
QUERY CLOUDREADCACHE
QUERY JOB STATUS=RUNNING

[srv_20min]
###########################################################################
# Commands run approximately every 20 minutes.
# Output file:   *-20min-show.xml
###########################################################################
# The following will allow for 20-minute interval coverage for
# performance instrumentation output.
INSTR END
INSTR BEGIN

# Show DB connection information
SHOW DBCONN

[srv_60min]
###########################################################################
# Commands run approximately every 60 minutes.
# Output file:   *-60min-show.xml
###########################################################################
SHOW ALLOC
SHOW REPLICATION
QUERY REPLICATION * STATUS=RUNNING FORMAT=DETAIL
SHOW LOCKS
SHOW CLOUDREADCACHE

[srv_daily]
###########################################################################
# Commands that are run approximately at the *start* of each 24 hour cycle.
# Note that the Spectrum Protect server is already configured to run a
# "QUERY SYSTEM" command within this thread.
# Output file:   *-24hour-show.xml
# Other synonymous stanzas:  [extra1_commands]   [extrasrv_commands]
###########################################################################
# Fetch information about drives, basic server information,
# schedules, copygroups, etc.
QUERY LIBRARY FORMAT=DETAILED
QUERY DRIVE FORMAT=DETAILED
QUERY SAN
QUERY SERVER FORMAT=DETAILED
QUERY SCRIPT * FORMAT=DETAILED
# The following commands are issued to get additional info not included 
# with a 'q sys'. 
QUERY PATH FORMAT=DETAILED
QUERY MGMTCLASS FORMAT=DETAILED
QUERY COPYGROUP * * * STANDARD TYPE=backup FORMAT=DETAILED
QUERY COPYGROUP * * * STANDARD TYPE=archive FORMAT=DETAILED
QUERY SCHEDULE FORMAT=DETAILED
QUERY SCHEDULE TYPE=ADMIN FORMAT=DETAILED
QUERY STGRULE FORMAT=DETAILED
QUERY CONNECTION FORMAT=DETAILED
QUERY REPLFAILURES

# Show container storage pool information
SHOW SDPOOL
SHOW SDDIRECTORY

# duplicated from srv_summary so as to catch these during ad-hoc archives
QUERY REPLRULE 
SELECT * FROM STGRULES
SELECT * FROM SUBRULES
QUERY RETRULE FORMAT=DETAILED

[srv_summary]
###########################################################################
# Commands that are run approximately at the *end* of each 24 hour cycle.
# Output file:   *-24hour-show.xml
# Other synonymous stanzas:  [extra2_commands]
###########################################################################
# Fetch information about replication failures and protect stgpool status.
QUERY REPLFAIL *
QUERY PROTECTS * FORMAT=DETAILED
SHOW MONVARS
QUERY REPLICATION * FORMAT=DETAILED
QUERY REPLRULE 
SELECT * FROM STGRULES
SELECT * FROM SUBRULES
QUERY RETRULE FORMAT=DETAILED

[srv_srtcvs]
###########################################################################
# Commands that are run approximately at the *end* of each 24 hour cycle.
# Output file:   *-srt.xml
# Other synonymous stanzas: 
# Details - The following commands must all be of the form:
#    select * from YOURDESIREDTABLE -comma
#
#    The server will use the table name to lookup the column names using
#    select colname,'' from syscat.columns where tabname='DBSPACE' order by COLNO -comma
#
#    The results of which will be prepended to the command provided so as
#    to provide column header names.
###########################################################################
# Fetch information for SRT and have servermon post process into CSV
SELECT * FROM DBSPACE -comma
SELECT * FROM LOG -comma
SELECT * FROM DEVCLASSES -comma
SELECT * FROM DEVCLASSES_DIR -comma
SELECT * FROM STGPOOLS -comma
SELECT * FROM STGPOOL_DIRS -comma


#**************************************************************************
# Operating System and Db2 Commands
#
# The following stanzas determine commands which are run from the Servermon
# offboard agent within an operating system level command shell on the 
# Spectrum Protect server system. Behavior will differ based on the content
# of each command in the following 3 ways. Note that a command is checked
# to see if it conforms to (1), then (2), then (3), in that order:
#
# (1) If a command includes the word "select", then it is assumed to be a 
# Db2 statement and is executed with a direct call to Db2. 
# For example: "select count(*) from DBALIAS.sd_containers"
# Destructive commands which include delete/drop/update are ignored.
# These Db2 queries should be surrounded by double quotes (") and may span
# multiple lines in this file.
#
# (2) If a command is prefixed with one of the following platform 
# indicators, then it will be run only for that specific platform within a
# command shell on that platform:
#     AIX:   -  IBM AIX
#     LIN:   -  Linux
#     WIN:   -  Microsoft Windows
#
# (3) Finally, if a command includes the word "db2", then it is assumed to
# either be a "db2" or a "db2pd" command and it is run, regardless of
# operating system platform, on a Db2-enabled command line shell.
#
# The choice of which stanza to place a command in determines how
# frequently it runs, which output file it is included in, and whether or
# not the command output is parsed as comma-separated value (CSV) content.
# See each of the stanzas below for more details. Commands which feature
# the word "DBALIAS" will have that word replaced by the value of "dbalias"
# from the servermon.ini file. Commands followed immediately by a line that
# starts with the special "OUTPUTFILE" text will be routed to a special
# filename with the content after the semi-colon in the filename. See
# various examples below in the servermon_csv_summary stanza.
#**************************************************************************

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Commands that run approximately every 10 minutes
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[servermon_csv_10min]
###########################################################################
# Output file:  *-10min.csv
# CSV-parsed output
###########################################################################
# List out data related to amount of data replicated in this interval
"select * from tsmgui_replsrv_grid for read only with ur"
#OUTPUTFILE:amtreplicated.csv

[servermon_10min]
###########################################################################
# Output file:  *-10min.xml
###########################################################################
# List out IBM Spectrum Protect Process information that is useful for
# looking at performance of processes
"select process_num as Number ,
       process ,
       start_time ,
       current_timestamp as Current_Time ,
       (cast(files_processed as decimal(18,0))) as Files ,
       (cast(bytes_processed as decimal(18,0)))/1024/1024 as MB ,
       timestampdiff(2,char(current_timestamp-start_time)) as Elapsed_Time,
       case when timestampdiff(2,char(current_timestamp-start_time)) = 0 then 0 else
         (cast(files_processed as decimal(18,0))/timestampdiff(2,char(current_timestamp-start_time))) end as Files_Second ,
       case when timestampdiff(2,char(current_timestamp-start_time)) = 0 then 0 else
         (cast(bytes_processed as decimal(18,0))/1024/1024/timestampdiff(2,char(current_timestamp-start_time))) end as MBytes_Second
  from processes
  order by process_num desc for read only with ur"

# On Linux, collect pstack and gstack information for the dsmserv process.
# Note that PID will be replaced by the dsmserv process by servermon.
#
# These have been disabled for 8.1.10 due to the lockup problem with gstack/pstack
# when running on systems with tape drives can cause dsmserv to hang
#LIN:/usr/bin/pstack PID
#LIN:/usr/bin/gstack PID

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Commands that run approximately every 20 minutes
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[servermon_csv_20min]
###########################################################################
# Output file:  *-20min.csv
# CSV-parsed output
###########################################################################
# List out IBM Spectrum Protect Process information, including file and
# data movement information. Useful for looking at performance of processes.
"select process_num as Number ,
       process ,
       start_time ,
       current_timestamp as Current_Time ,
       (cast(files_processed as decimal(18,0))) as Files ,
       (cast(bytes_processed as decimal(18,0)))/1024/1024 as MB ,
       timestampdiff(2,char(current_timestamp-start_time)) as Elapsed_Time ,
       case when timestampdiff(2,char(current_timestamp-start_time)) = 0 then 0 else
         (cast(files_processed as decimal(18,0))/timestampdiff(2,char(current_timestamp-start_time))) end as Files_Second ,
       case when timestampdiff(2,char(current_timestamp-start_time)) = 0 then 0 else
         (cast(bytes_processed as decimal(18,0))/1024/1024/timestampdiff(2,char(current_timestamp-start_time))) end as MBytes_Second
  from processes
  order by process_num desc for read only with ur"
#OUTPUTFILE:processperf.csv

[servermon_20min]
###########################################################################
# Output file:  *-20min.xml
###########################################################################
# Fetch operating system disk information, specific to platform
#WIN:wmic logicaldisk get size,freespace,caption
#AIX:df -m
#LIN:df -m 
WIN:netstat -s -e -p
AIX:netstat -p tcp
AIX:svmon -P $(ps -ef | grep "dsm" | awk '{ print $2 }')
AIX:svmon -P $(ps -ef | grep "db2[s]ysc" | awk '{ print $2 }')
LIN:netstat -s -t

# List out DB2 Selects that are longer running than 1 second. If you see values
# exceeding 1 hour (3600 seconds) these should be examined further
"select elapsed_time_sec, substr(activity_state,1,4) as state,
	   substr( stmt_text, 1, 1536) as stmt_text,
       application_handle as applHandle
  from sysibmadm.mon_current_sql where elapsed_time_sec > 0 for read only with ur"

# Fetch a count of client nodes  
"SELECT count(nodename) as Number_of_registered_Clients from NODES for read only with ur"

# Sizing info related scripts. The following 3 scrips are using for sizing servers, and to check to see if a DB is in line with expected growth

# 1. Daily ingest select - (used for sizing)
"SELECT n.platform, DATE(s.START_TIME) AS Date, (CAST(FLOAT(SUM(s.bytes_protected))/1024/1024 AS DECIMAL(12,2))) AS PROTECTED_MB, (CAST(FLOAT(SUM(s.bytes_written))/1024/1024 AS DECIMAL(12,2))) AS WRITTEN_MB, (CAST(FLOAT(SUM(s.dedup_savings))/1024/1024 AS DECIMAL(12,2))) AS DEDUPSAVINGS_MB, (CAST(FLOAT(SUM(s.comp_savings))/1024/1024 AS DECIMAL(12,2))) AS COMPSAVINGS_MB, (CAST(FLOAT(SUM(s.dedup_savings))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS DEDUP_PCT, (CAST(FLOAT(SUM(s.bytes_protected) - SUM(s.bytes_written))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS SAVINGS_PCT from summary s inner join nodes n on s.entity = n.nodename WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP') GROUP BY n.platform, DATE(S.START_TIME) order by 1,2 for read only with ur"

# 2. Total Managed Data - used for sizing)
"Select sum(reporting_mb)/1024/1024 AS Total_Managed_TB from occupancy where STGPOOL_NAME in (select distinct STGPOOL_NAME FROM stgpools where POOLTYPE='PRIMARY') and NODE_NAME !='' for read only with ur"

# 3. List out what the average filesize is for this environment in KB -(Used for sizing)
"select ( sum(reporting_mb*1024) / sum(cast(num_files as bigint)) ) as avgobjectsizekb from occupancy where STGPOOL_NAME in (select distinct STGPOOL_NAME FROM stgpools where POOLTYPE='PRIMARY') and NODE_NAME !='' for read only with ur"

# Display all server scripts
"select name,line,command from scripts order by name,line for read only with ur"

[db2commands]
###########################################################################
# Output file:  *-db2.xml
###########################################################################
db2 get snapshot for database on DBALIAS
db2 list application show detail
db2 get snapshot for all applications
db2 get dbm cfg

# List out DB2 Selects that are longer running than 1 second. If you see values
# exceeding 1 hour (3600 seconds) these should be examined further
"select elapsed_time_sec, substr(activity_state,1,4) as state,
substr( stmt_text, 1, 1536) as stmt_text,
application_handle as applHandle
from sysibmadm.mon_current_sql for read only with ur"

"select tu.name,cast(rows_in_table as bigint),cast(table_used_mb as bigint),cast(table_alloc_mb as bigint),cast(index_used_mb as bigint),cast(index_alloc_mb as bigint) from ( select substr(tabname,1,28) as name,bigint(card) as rows_in_table,bigint(float(t.npages)/(1024/(b.pagesize/1024))) as table_used_mb from syscat.tables t, syscat.tablespaces b where t.tbspace=b.tbspace and t.tabschema='TSMDB1' ) as tu, ( select substr(tabname,1,28) as name,bigint(sum(i.nleaf)*(b.pagesize/1024)/1024) as index_used_mb from syscat.indexes i, syscat.tablespaces b where i.tbspaceid=b.tbspaceid and i.tabschema='TSMDB1' group by tabname,pagesize ) as iu, ( select substr(tabname,1,28) as name,bigint(data_object_p_size/1024) as table_alloc_mb,bigint(index_object_p_size/1024) as index_alloc_mb from sysibmadm.admintabinfo ) as ta where tu.name=iu.name and tu.name=ta.name and (table_alloc_mb+index_alloc_mb)>5 order by table_alloc_mb desc,index_alloc_mb desc,tu.name for read only with ur"

[db2pdcommands]
###########################################################################
# Output file:  *-db2pd.xml
###########################################################################
db2pd -db DBALIAS -bufferpools -runstats -reorgs index -cleaner -wlocks -osinfo -dirtypages summary -mempools -dbcfg
db2pd -dbptnmem
db2pd -db DBALIAS -transactions -logs 
db2pd -db DBALIAS -tcbstats

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Commands that run approximately every 60 minutes
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[servermon_csv_60min]
###########################################################################
# Output file:  *-60min.csv
# CSV-parsed output
###########################################################################

[servermon_60min]
###########################################################################
# Output file:  *-60min.txt
###########################################################################

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Commands that run at approximately the *start* of every 24 hours
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[servermon_csv_daily]
###########################################################################
# Output file:  *-daily.csv
# CSV-parsed output
###########################################################################

[servermon_daily]
###########################################################################
# Output file:  *-daily.xml
###########################################################################
# Track DB growth
"select * from DB for read only with ur"

# Total Managed Data - used for sizing
"select sum(reporting_mb)/1024/1024 AS Total_Managed_TB from occupancy
    where STGPOOL_NAME in (select distinct STGPOOL_NAME FROM stgpools where POOLTYPE='PRIMARY') and NODE_NAME !='' for read only with ur"

# List out tape info: libraries, number of private and scratch tapes, 
# path information, etc.
"SELECT SOURCE_NAME,LIBRARY_NAME,ONLINE,COUNT(*) AS COUNT FROM PATHS GROUP BY SOURCE_NAME,LIBRARY_NAME,ONLINE for read only with ur"
"select LIBRARY_NAME as Library_Name, count(*) as All_Tapes from libvolumes group by LIBRARY_NAME for read only with ur"
"select LIBRARY_NAME as Library_Name, count(*) as Private from libvolumes where UPPER(status) like 'PRIVATE%' group by LIBRARY_NAME for read only with ur"
"select LIBRARY_NAME as Library_Name, count(*) as Scratch from libvolumes where UPPER(status) like 'SCRATCH%' group by LIBRARY_NAME for read only with ur"

# List out occupancy by storage pool, Used Primary, used Copy storage pool totals, number of files
select o.stgpool_name, s.pooltype,s.stg_type, sum ( o.reporting_mb ) /1024/1024 as  Occupancy_TB, cast(sum(o.NUM_FILES) as decimal(12,0)) as Number_of_files from occupancy o join stgpools s on o.stgpool_name = s.stgpool_name and o.node_name !='' group by o.stgpool_name, s.pooltype,s.stg_type order by s.pooltype desc for read only with ur
select s.pooltype,s.stg_type, sum ( o.reporting_mb ) /1024/1024 as Occupancy_TB, cast(sum(o.NUM_FILES) as decimal(12,0)) as Number_of_files from occupancy o join stgpools s on o.stgpool_name = s.stgpool_name and o.node_name !='' group by s.stg_type,s.pooltype order by s.pooltype desc for read only with ur
select s.stg_type, sum ( o.reporting_mb ) /1024/1024 as Occupancy_TB, cast(sum(o.NUM_FILES) as decimal(12,0)) as Number_of_files from occupancy o join stgpools s on o.stgpool_name = s.stgpool_name and o.node_name !='' group by s.stg_type for read only with ur
select s.pooltype , sum ( o.reporting_mb ) /1024/1024 as Occupancy_TB, cast(sum(o.NUM_FILES) as decimal(12,0)) as Number_of_files from occupancy o join stgpools s on o.stgpool_name = s.stgpool_name and o.node_name !='' group by s.pooltype order by s.pooltype desc for read only with ur
#occupancy by platform
select n.platform_name,count(n.node_name) as NODECOUNT,sum(o.reporting_mb)/1024/1024 as TB, cast(sum(o.NUM_FILES) as decimal(12,0)) as Number_of_files from nodesview n, occupancy o where n.node_name = o.node_name and o.node_name<>'' and n.platform_name<>'' and o.stgpool_name in (select stgpool_name from stgpools where pooltype='PRIMARY') group by n.platform_name for read only with ur

# List out what the average filesize is for this environment in KB 
"select cast(sum(logical_MB)*1024 / sum(NUM_FILES) as decimal(9,0)) as Average_Filesize_in_KB
    from OCCUPANCY where stgpool_name in
    (select stgpool_name from stgpools where pooltype='PRIMARY' or pooltype='DIRECTORY') for read only with ur"

# Daily ingest information from summary.
"SELECT DATE(s.START_TIME) AS Date,
        (CAST(FLOAT(SUM(s.bytes))/1024/1024/1024 AS DECIMAL(12,2))) AS SESSION_BYTES_GB,
	(CAST(FLOAT(SUM(s.bytes_protected))/1024/1024/1024 AS DECIMAL(12,2))) AS PROTECTED_GB,
	(CAST(FLOAT(SUM(s.bytes_written))/1024/1024/1024 AS DECIMAL(12,2))) AS WRITTEN_GB,
	(CAST(FLOAT(SUM(s.dedup_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS DEDUPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.comp_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS COMPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.dedup_savings))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS DEDUP_PCT,
	(CAST(FLOAT(SUM(s.comp_savings))/FLOAT(SUM(s.bytes_protected)-SUM(s.dedup_savings))*100 AS DECIMAL(5,2))) AS COMP_PCT
  from summary s
	   WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP') GROUP BY DATE(S.START_TIME) ORDER BY DATE DESC for read only with ur"

# Daily transfer to cloud-container storage pool object storage.
"select DATE(s.START_TIME) AS Date, SUBSTR(s.Owner,1,25) as Pool, (CAST(FLOAT(SUM(s.BYTES_AFFECTED))/1024/1024 AS DECIMAL(12,2)))
    AS TRANSFERRED_MB, SUM(BIGINT(timestampdiff(2, char(s.end_time - s.start_time)))) as TOTAL_TIME_SEC,
	CAST((FLOAT(SUM(s.BYTES_AFFECTED))/1024/1024)/(SUM(BIGINT(timestampdiff(2, char(s.end_time - s.start_time)))))
	AS DECIMAL(12,2)) as TRANSFER_MBPS from activity_summary s WHERE activity='LOCAL_TO_CLOUD_TRANSFER'
	GROUP BY DATE(s.START_TIME), Owner for read only with ur"

# Sizing info related scripts. The following 3 scrips are using for sizing servers, and to check to see if a DB is in line with expected growth
# 1. Daily ingest select - (used for sizing)
"SELECT n.platform, DATE(s.START_TIME) AS Date, (CAST(FLOAT(SUM(s.bytes_protected))/1024/1024 AS DECIMAL(12,2))) AS PROTECTED_MB, (CAST(FLOAT(SUM(s.bytes_written))/1024/1024 AS DECIMAL(12,2))) AS WRITTEN_MB, (CAST(FLOAT(SUM(s.dedup_savings))/1024/1024 AS DECIMAL(12,2))) AS DEDUPSAVINGS_MB, (CAST(FLOAT(SUM(s.comp_savings))/1024/1024 AS DECIMAL(12,2))) AS COMPSAVINGS_MB, (CAST(FLOAT(SUM(s.dedup_savings))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS DEDUP_PCT, (CAST(FLOAT(SUM(s.bytes_protected) - SUM(s.bytes_written))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS SAVINGS_PCT from summary s inner join nodes n on s.entity = n.nodename WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP') GROUP BY n.platform, DATE(S.START_TIME) order by 1,2 for read only with ur"

# 2. Total Managed Data - used for sizing)
"Select sum(reporting_mb)/1024/1024 AS Total_Managed_TB from occupancy where STGPOOL_NAME in (select distinct STGPOOL_NAME FROM stgpools where POOLTYPE='PRIMARY') and NODE_NAME !='' for read only with ur"

# 3. List out what the average filesize is for this environment in KB -(Used for sizing)
"select ( sum(reporting_mb*1024) / sum(cast(num_files as bigint)) ) as avgobjectsizekb from occupancy where STGPOOL_NAME in (select distinct STGPOOL_NAME FROM stgpools where POOLTYPE='PRIMARY') and NODE_NAME !='' for read only with ur"

# Display all server scripts
"select name,line,command from scripts order by name,line for read only with ur"

# Borrowed from analyze_DB2_formulas.pl from Technote 1683633.
# The following can assist with determining if Reorg is needed.
# For the larger tables used by Spectrum Protect, determine the number
# of rows, the amount of used space, the amount of allocated space,
# the used index space, and the allocated index space.
"select tu.name,cast(rows_in_table as bigint),cast(table_used_mb as bigint),
    cast(table_alloc_mb as bigint),cast(index_used_mb as bigint),cast(index_alloc_mb as bigint)
    from ( select substr(tabname,1,28) as name,bigint(card) as rows_in_table,
    bigint(float(t.npages)/(1024/(b.pagesize/1024))) as table_used_mb from syscat.tables t,
    syscat.tablespaces b where t.tbspace=b.tbspace and t.tabschema='DBALIAS' ) as tu,
    ( select substr(tabname,1,28) as name,bigint(sum(i.nleaf)*(b.pagesize/1024)/1024) as
    index_used_mb from syscat.indexes i, syscat.tablespaces b where i.tbspaceid=b.tbspaceid
    and i.tabschema='DBALIAS' group by tabname,pagesize ) as iu, ( select substr(tabname,1,28)
    as name,bigint(data_object_p_size/1024) as table_alloc_mb,bigint(index_object_p_size/1024)
    as index_alloc_mb from sysibmadm.admintabinfo ) as ta where tu.name=iu.name and
    tu.name=ta.name and (table_alloc_mb+index_alloc_mb)>1024 order by table_alloc_mb desc,
    index_alloc_mb desc,tu.name for read only with ur"

# Query the SD_POOL_CLUSTERS table to determine container storage pool
# estimates for occupancy, dedup/compression savings, and other statistics.
"select p.POOLNAME, p.POOLID, s.NUMFILES as NUM_FILES,
        CAST(FLOAT(s.RPTOCCUPANCY)/1024/1024 AS DECIMAL(12,2)) as TOTAL_LOGICAL_MB,
		CAST(FLOAT(s.RPTOCCUPANCY - s.PHYSOCCUPANCY)/1024/1024 AS DECIMAL(12,2)) as DEDUP_SAVINGS_MB,
	    CAST(FLOAT(s.COMPRSAVED)/1024/1024 AS DECIMAL(12,2)) as COMPRESSION_SAVINGS_MB,
		CAST(FLOAT((s.RPTOCCUPANCY - s.PHYSOCCUPANCY) + s.COMPRSAVED)/1024/1024 AS DECIMAL(12,2)) as TOTAL_SAVINGS_MB,
		CAST(FLOAT(s.PHYSOCCUPANCY)/1024/1024 AS DECIMAL(12,2)) as POST_DEDUP_MB,
	    CAST(FLOAT(s.PROT_TOTAL)/1024/1024 AS DECIMAL(12,2)) as POST_COMPRESSION_MB,
	    CAST(FLOAT(s.UNREF_TOTAL)/1024/1024 AS DECIMAL(12,2)) as PENDING_MB,
	    CAST(FLOAT(s.PHYSLENGTH)/1024/1024 AS DECIMAL(12,2)) as PHYSICAL_LENGTH_MB,
	    CAST(FLOAT(s.ENCRYPTLENGTH)/1024/1024 AS DECIMAL(12,2)) as ENCRYPTED_LENGTH_MB
    from SD_POOL_CLUSTERS s inner join SS_POOLS p
	    on s.POOLID = p.POOLID
	where s.CK1=0 and s.CK2=0 for read only with ur"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Commands that run at approximately the *end* of every 24 hours
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[servermon_stats]
###########################################################################
# Commands in this stanza behave in a special way.
# Commands which feature the special word "INTERVAL" will have that word
# replaced during execution with the value of "statsinterval" under the
# [Constants] stanza in the servermon.ini file. Commands which feature the
# word "OUTPUT" will have that word replaced with a custom output file value
# if there is any text after "OUTPUT" this will be used in the outfile file
# name for the command executed for a specific day.
# This stanza could be used to drive commands that run periodically (such
# as Linux iostat) to custom output files.
###########################################################################
# On Linux, collect iostat, vmstat, and pstack/gstack information
LIN:iostat -xtk INTERVAL > OUTPUT
LIN:vmstat -tw INTERVAL > OUTPUT
LIN:/usr/sbin/nfsiostat INTERVAL > OUTPUT

# On AIX, collect iostat, vmstat, and lparstat information
AIX:iostat -DlT INTERVAL > OUTPUT
AIX:vmstat -Itw INTERVAL > OUTPUT
AIX:lparstat INTERVAL > OUTPUT
AIX:lparstat -i > OUTPUT-info
AIX:/usr/sbin/nfsstat INTERVAL > OUTPUT

# On Windows, collect iostat and vmstat style information via db2pd
WIN:db2pd -db DBALIAS -iostat t l INTERVAL 2880 COMPUTERNAME > OUTPUT-iostat
WIN:db2pd -db DBALIAS -vmstat t INTERVAL 2880 COMPUTERNAME > OUTPUT-vmstat

