# List out the DB2 table information that is useful for knowing if 
# reorgs are needed for certain tables/indices
"select tu.name,cast(rows_in_table as bigint),cast(table_used_mb as bigint),
    cast(table_alloc_mb as bigint),cast(index_used_mb as bigint),cast(index_alloc_mb as bigint)
	from ( select substr(tabname,1,28) as name,bigint(card) as rows_in_table,
	bigint(float(t.npages)/(1024/(b.pagesize/1024))) as table_used_mb
	from syscat.tables t, syscat.tablespaces b where t.tbspace=b.tbspace and t.tabschema='DBALIAS' ) as tu,
	( select substr(tabname,1,28) as name,bigint(sum(i.nleaf)*(b.pagesize/1024)/1024) as index_used_mb
	from syscat.indexes i, syscat.tablespaces b where i.tbspaceid=b.tbspaceid and i.tabschema='DBALIAS'
	group by tabname,pagesize ) as iu, ( select substr(tabname,1,28) as name,
	bigint(data_object_p_size/1024) as table_alloc_mb,bigint(index_object_p_size/1024) as index_alloc_mb from sysibmadm.admintabinfo )
	as ta where tu.name=iu.name and tu.name=ta.name and (table_alloc_mb+index_alloc_mb)>5
	order by table_alloc_mb desc,index_alloc_mb desc,tu.name for read only with ur"

# Produce a list of tables/indices and the date of last Reorg
"select cast( substr(name,10,min(30,length(name)-9)) as char(30)) as Tablename,
    substr(char(datetime),1,25) as Last_Reorg from DBALIAS.global_attributes
	where owner='RDB' and name like 'REORG_TB_%' and datetime is not NULL
	order by datetime desc for read only with ur"
	
"select cast( substr(name,10,min(30,length(name)-9)) as char(30)) as Indices_for_Tablename,
    substr(char(datetime),1,25) as Last_Reorg from DBALIAS.global_attributes
	where owner='RDB' and name like 'REORG_IX_%' and datetime is not NULL
	order by datetime desc for read only with ur"

# List out runstats history information.
"SELECT substr(A.TABSCHEMA,1,25)TABSCHEMA, substr(A.TABNAME,1,50)TABNAME,
    STATS_TIME, STATSTYPE FROM SYSIBMADM.ADMINTABINFO A, SYSCAT.TABLES B
	WHERE A.TABSCHEMA=B.TABSCHEMA and A.TABNAME=B.TABNAME
	order by STATS_TIME for read only with ur"

# List out all DB2 table names
"select tabname from syscat.tables for read only with ur"

# List out the top days of ingest totals from the summary table
"select date(start_time) as DATE,sum(summary.bytes)/1024/1024/1024/1024 as TOP_INGEST
  from summary
  WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP')
  group by date(start_time)
  order by TOP_INGEST desc fetch first 25 rows only for read only with ur"

[servermon_csv_summary]
###########################################################################
# Output file:  *-csv-EndOfDay
###########################################################################
# Determine the top days for ingest
"select date(start_time) as DATE,sum(DBALIAS.summary.bytes)/1024/1024/1024 as TOP_INGEST
    from DBALIAS.summary WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP')
	group by date(start_time) order by TOP_INGEST desc fetch first 25 rows only for read only with ur"
#OUTPUTFILE:topingest.csv

# Daily client workload. (From Container Pools Best Practices)
"SELECT DATE(s.START_TIME) AS Date, (CAST(FLOAT(SUM(s.bytes_protected))/1024/1024 AS DECIMAL(12,2))) AS PROTECTED_MB,
    (CAST(FLOAT(SUM(s.bytes_written))/1024/1024 AS DECIMAL(12,2))) AS WRITTEN_MB,
	(CAST(FLOAT(SUM(s.dedup_savings))/1024/1024 AS DECIMAL(12,2))) AS DEDUPSAVINGS_MB,
	(CAST(FLOAT(SUM(s.comp_savings))/1024/1024 AS DECIMAL(12,2))) AS COMPSAVINGS_MB,
	(CAST(FLOAT(SUM(s.dedup_savings))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS DEDUP_PCT,
	(CAST(FLOAT(SUM(s.bytes_protected) - SUM(s.bytes_written))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS SAVINGS_PCT,
	SUM(BIGINT(timestampdiff(2, char(s.end_time - s.start_time)))) as TOTAL_TIME_SEC,
	CAST((FLOAT(SUM(s.bytes_protected))/1024/1024)/(SUM(BIGINT(timestampdiff(2, char(s.end_time - s.start_time))))) AS DECIMAL(12,2)) as AVG_FE_MBPS, CAST((FLOAT(SUM(s.bytes_written))/1024/1024)/(SUM(BIGINT(timestampdiff(2, char(s.end_time - s.start_time))))) AS DECIMAL(12,2)) as AVG_BE_MBPS
	from summary s WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP')
	GROUP BY DATE(S.START_TIME) for read only with ur"
#OUTPUTFILE:clientworkload.csv

# 25 Worst Overall Savings Nodes sorted by overall data savings percent. 
"SELECT SUBSTR(s.ENTITY,1,25) AS NODE, (CAST(FLOAT(SUM(s.bytes_protected))/1024/1024/1024 AS DECIMAL(12,2))) AS PROTECTED_GB,
    (CAST(FLOAT(SUM(s.dedup_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS DEDUPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.comp_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS COMPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.comp_savings)+SUM(s.dedup_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS OVERALL_SAVINGS_GB,
	(CAST(FLOAT(SUM(s.dedup_savings)+SUM(s.comp_savings))/FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS OVERALL_SAVINGS_PCT
	from summary_extended s WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP')
	GROUP BY S.ENTITY ORDER BY OVERALL_SAVINGS_PCT ASC FETCH FIRST 25 ROWS ONLY for read only with ur"
#OUTPUTFILE:worstsavings.csv

# 25 Worst Deduplicating Nodes sorted by data deduplication percent. 
# (From Container Pool Best Practices)
"SELECT SUBSTR(s.ENTITY,1,25) AS NODE, (CAST(FLOAT(SUM(s.bytes_protected))/1024/1024/1024 AS DECIMAL(12,2))) AS PROTECTED_GB,
    (CAST(FLOAT(SUM(s.dedup_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS DEDUPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.comp_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS COMPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.dedup_savings)) / FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS DEDUP_PCT,
	(CAST(FLOAT(SUM(s.comp_savings)) / FLOAT(SUM(s.bytes_protected)-SUM(s.dedup_savings))*100 AS DECIMAL(5,2))) AS COMP_PCT
	from summary_extended s WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP')
	GROUP BY S.ENTITY ORDER BY DEDUP_PCT ASC FETCH FIRST 25 ROWS ONLY for read only with ur"
#OUTPUTFILE:worstdedup.csv

# 25 Worst Compressed Nodes by compression percent. 
# (From Container Pool Best Practices)
"SELECT SUBSTR(s.ENTITY,1,25) AS NODE, (CAST(FLOAT(SUM(s.bytes_protected))/1024/1024/1024 AS DECIMAL(12,2))) AS PROTECTED_GB,
    (CAST(FLOAT(SUM(s.dedup_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS DEDUPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.comp_savings))/1024/1024/1024 AS DECIMAL(12,2))) AS COMPSAVINGS_GB,
	(CAST(FLOAT(SUM(s.dedup_savings)) / FLOAT(SUM(s.bytes_protected))*100 AS DECIMAL(5,2))) AS DEDUP_PCT,
	(CAST(FLOAT(SUM(s.comp_savings)) / FLOAT(SUM(s.bytes_protected)-SUM(s.dedup_savings))*100 AS DECIMAL(5,2))) AS COMP_PCT
	from summary_extended s WHERE activity in ('BACKUP','ARCHIVE', 'OBJECT CLIENT BACKUP')
	GROUP BY S.ENTITY ORDER BY COMP_PCT ASC FETCH FIRST 25 ROWS ONLY for read only with ur"
#OUTPUTFILE:worstcompressed.csv

# Fetch the activity log for the previous day
"select distinct * from actlog where date_time>=current_timestamp-25 hours order by date_time for read only with ur"
#OUTPUTFILE:activitylog.csv

# Fetch the summary log for the previous day
"select * from summary_extended where start_time>=current_timestamp-25 hours or end_time>=current_timestamp-25 hours for read only with ur"
#OUTPUTFILE:summarylog.csv

# Generate a process workload chart
select entity,start_time,end_time from summary where activity='PROCESS_END' and upper(entity)<>'AUDIT LICENSE' and start_time>=current_timestamp-25 days UNION select entity,start_time,current_timestamp from summary where activity='PROCESS_START' and upper(entity)<>'AUDIT LICENSE' and start_time>=current_timestamp-25 days and start_time not in (select start_time from summary where activity='PROCESS_END')
#OUTPUTFILE:procWorkload.csv

# Fetch the nodes table:
"select * from nodes date_time for read only with ur"
